<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Materi Sorting &amp; Studi Kasus Sorting</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#121212; --bg2:#1A1A1A; --border:#2C2C2C; --text:#ECECEC; --muted:#9A9A9A;
    --accent:#E3344F; --accent-text:#ffffff;
    --sans:'Inter', system-ui, sans-serif;
    --serif:'Source Serif 4', Georgia, serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#FFFFFF; --bg2:#F7F7F7; --border:#E0E0E0; --text:#000000; --muted:#595959;
      --accent:#C92444; --accent-text:#ffffff;
    }
  }
  :root[data-theme="light"]{ --bg:#FFFFFF; --bg2:#F7F7F7; --border:#E0E0E0; --text:#000000; --muted:#595959; --accent:#B9862E; --accent-text:#FBF6E7; }
  :root[data-theme="dark"]{ --bg:#121212; --bg2:#1A1A1A; --border:#2C2C2C; --text:#ECECEC; --muted:#9A9A9A; --accent:#E0B15E; --accent-text:#241a04; }

  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
  *{ box-sizing:border-box; }
  body{
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }

  header.shell-top{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--border); background:var(--bg2); flex:none;
  }
  header.shell-top .title{ display:flex; flex-direction:column; gap:1px; margin-right:auto; min-width:0; }
  header.shell-top .title h1{
    margin:0; font-family:var(--serif); font-size:18px; font-weight:600; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  header.shell-top .title p{ margin:0; font-size:11.5px; color:var(--muted); }

  .tabs{ display:flex; gap:6px; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:3px; flex:none; }
  .tabs button{
    font-family:var(--sans); font-weight:600; font-size:13px; color:var(--muted);
    background:transparent; border:none; border-radius:8px; padding:8px 14px; cursor:pointer;
    display:flex; align-items:center; gap:7px; transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .tabs button:hover{ color:var(--text); }
  .tabs button.active{ background:var(--accent); color:var(--accent-text); }
  .tabs button .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex:none; }

  .theme-btn{
    flex:none; width:36px; height:36px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .15s ease, transform .1s ease;
  }
  .theme-btn:hover{ background:var(--border); }
  .theme-btn:active{ transform:scale(.92); }

  main.shell-body{ flex:1; min-height:0; position:relative; }
  .frame-wrap{
    position:absolute; inset:0; opacity:0; visibility:hidden; pointer-events:none;
    will-change:opacity, transform;
  }
  .frame-wrap.active{ opacity:1; visibility:visible; pointer-events:auto; z-index:2; }
  .frame-wrap.leaving{ opacity:1; visibility:visible; pointer-events:none; z-index:1; }
  main.shell-body{ overflow:hidden; }
  .tabs{ position:relative; isolation:isolate; }
  .tabs button{ position:relative; z-index:1; }
  .tabs button.active{ background:transparent; }
  .tab-pill{
    position:absolute; top:3px; bottom:3px; left:0; width:0; border-radius:8px; background:var(--accent);
    z-index:0; pointer-events:none; box-shadow:0 4px 14px -4px var(--accent);
    transition:transform .45s cubic-bezier(.22,1,.36,1), width .45s cubic-bezier(.22,1,.36,1);
  }
  .tab-pill.no-anim{ transition:none; }
  @media (prefers-reduced-motion: reduce){ .tab-pill{ transition:none; } }
  .frame-wrap iframe{ width:100%; height:100%; border:none; display:block; background:var(--bg2); }

  .loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; color:var(--muted); font-size:13px;
  }
  .loading .spin{
    width:22px; height:22px; border-radius:50%; border:2.5px solid var(--border); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:640px){
    header.shell-top{ padding:12px; }
    header.shell-top .title h1{ font-size:15px; }
    .tabs button{ padding:7px 10px; font-size:12.3px; }
    .tabs button span.label-long{ display:none; }
  }
  @supports (height:100dvh){ body{ height:100dvh; } }
  @media (max-width:420px){
    header.shell-top{ gap:8px; }
    header.shell-top .title p{ display:none; }
    .tabs{ flex:1 1 auto; }
    .tabs button{ flex:1; justify-content:center; }
  }
  @media (max-height:480px){
    header.shell-top{ padding-top:calc(6px + env(safe-area-inset-top,0px)); padding-bottom:6px; }
    header.shell-top .title p{ display:none; }
  }

  /* ---- maskot Skadi (GIF Tenor), hanya tampil di HP ---- */
  .skadi-mascot{
    display:none; position:fixed; z-index:20; right:4px;
    bottom:calc(4px + env(safe-area-inset-bottom,0px));
    width:74px; pointer-events:none;
    opacity:0; transform:translateY(12px) scale(.96);
    transition:opacity .5s ease, transform .6s cubic-bezier(.22,1,.36,1);
  }
  .skadi-mascot.show{ opacity:.9; transform:none; }
  .skadi-mascot .tenor-gif-embed{ width:100%; overflow:hidden;
    -webkit-mask-image:radial-gradient(ellipse 68% 68% at 50% 50%,#000 55%,transparent 100%);
            mask-image:radial-gradient(ellipse 68% 68% at 50% 50%,#000 55%,transparent 100%); }
  .skadi-mascot .tenor-gif-embed a{ display:none; }
  .skadi-mascot .tenor-gif-embed iframe{ pointer-events:none; }
  .skadi-mascot .mascot-x{
    position:absolute; top:-6px; left:-6px; width:22px; height:22px; border-radius:50%;
    border:1px solid var(--border); background:var(--bg2); color:var(--text);
    font-size:10px; line-height:1; cursor:pointer; pointer-events:auto; padding:0; opacity:.75;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  @media (max-width:640px){ .skadi-mascot{ display:block; } }
  @media (prefers-reduced-motion: reduce){ .skadi-mascot{ transition:none; } }

  /* ===== TEMA ABYSS: palet dari ilustrasi Skadi ===== */
  :root{ --bg:#060A16; --bg2:#0A1226; --border:#1E2B49; --text:#E8EEF8; --muted:#93A3C0; --accent:#E2364F; --accent-text:#ffffff; --cyan:#28D8F0; }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#EAF0F8; --bg2:#F4F8FD; --border:#C7D5E8; --text:#09112A; --muted:#465877; --accent:#C21F3F; --accent-text:#ffffff; --cyan:#0A87A0; } }
  :root[data-theme="light"]{ --bg:#EAF0F8; --bg2:#F4F8FD; --border:#C7D5E8; --text:#09112A; --muted:#465877; --accent:#C21F3F; --accent-text:#ffffff; --cyan:#0A87A0; }
  :root[data-theme="dark"]{ --bg:#060A16; --bg2:#0A1226; --border:#1E2B49; --text:#E8EEF8; --muted:#93A3C0; --accent:#E2364F; --accent-text:#ffffff; --cyan:#28D8F0; }
  header.shell-top{
    position:relative; overflow:hidden;
    background:
      linear-gradient(104deg, transparent 0 71%, rgba(226,54,79,.22) 71.15%, rgba(226,54,79,0) 74%),
      linear-gradient(98deg, transparent 0 78%, rgba(40,216,240,.16) 78.1%, rgba(40,216,240,0) 80.5%),
      var(--bg2);
    box-shadow:0 1px 0 color-mix(in srgb, var(--cyan) 30%, transparent), 0 8px 24px -14px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .tab-pill{ background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #fff) 0%, var(--accent) 60%, color-mix(in srgb, var(--accent) 70%, #000) 100%); }

  /* ===== UI gaya Arknights (shell) ===== */
  :root{ --ak-cyan:#12A8E6; --ak-cyan-2:#0B86C4; --ak-orange:#F26A1B; --ak-font:"Barlow Condensed","Bahnschrift","Arial Narrow","Roboto Condensed",sans-serif; --accent:#12A8E6; }
  :root[data-theme="light"]{ --accent:#0B86C4; }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --accent:#0B86C4; } }
  header.shell-top{ clip-path:polygon(0 0,100% 0,100% 100%,0 100%); border-bottom:3px solid var(--ak-orange);
    background:linear-gradient(112deg,var(--bg2) 0 78%,rgba(18,168,230,.16) 78.1% 84%,var(--bg2) 84.1%); }
  header.shell-top h1{ font-family:var(--ak-font); text-transform:uppercase; letter-spacing:.06em; font-size:24px; font-weight:700; }
  .tabs{ border-radius:0; gap:6px; background:transparent; border:none; padding:0; }
  .tabs button{ font-family:var(--ak-font); text-transform:uppercase; letter-spacing:.06em; font-size:16px; font-weight:700; border-radius:0;
    clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%); padding:8px 26px; color:#fff; background:linear-gradient(180deg,#1DB7F2,#0B86C4); opacity:.72; }
  .tabs button.active{ background:#f3f6fa; color:#10151f; opacity:1; box-shadow:inset 0 -4px 0 var(--ak-orange); }
  .tab-pill{ display:none; }
  .theme-toggle,#themeBtn{ border-radius:0; clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }


/* ===== mobile header: compact, balanced, no wrapping into a third line ===== */
@media (max-width:640px){
  header.shell-top{
    display:grid;
    grid-template-columns:minmax(0,1fr) 36px;
    grid-template-rows:auto auto;
    align-items:center;
    gap:7px 10px;
    padding:8px 10px 9px;
    min-height:0;
  }

  header.shell-top .title{
    grid-column:1;
    grid-row:1;
    min-width:0;
    margin:0;
    align-self:center;
  }

  header.shell-top .title h1{
    font-size:16px;
    line-height:1.05;
    letter-spacing:.045em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  header.shell-top .title p{ display:none; }

  header.shell-top .tabs{
    grid-column:1 / -1;
    grid-row:2;
    width:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:5px;
    margin:0;
    min-width:0;
  }

  header.shell-top .tabs button{
    width:100%;
    min-width:0;
    height:36px;
    padding:7px 8px;
    justify-content:center;
    gap:6px;
    font-size:13px;
    line-height:1;
    letter-spacing:.045em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  header.shell-top .tabs button .dot{ width:5px; height:5px; }
  header.shell-top .tabs button .label-long{ display:none; }

  header.shell-top .theme-btn{
    grid-column:2;
    grid-row:1;
    justify-self:end;
    width:34px;
    height:34px;
    padding:0;
    margin:0;
    font-size:14px;
  }
}

@media (max-width:380px){
  header.shell-top{ gap:6px 8px; padding:7px 8px 8px; }
  header.shell-top .title h1{ font-size:15px; }
  header.shell-top .tabs button{ height:34px; font-size:12px; padding:6px 6px; }
  header.shell-top .theme-btn{ width:32px; height:32px; }
}

/* ===== mobile: stable viewport, never force the page back to the top ===== */
html, body{ overscroll-behavior-y:none; overflow-anchor:none; }
.shell-body, .frame-wrap{ overscroll-behavior:contain; }
@media (max-width:640px){
  html{ height:100%; }
  body{ width:100%; height:100svh; min-height:100svh; overflow:hidden; }
  main.shell-body{ min-height:0; height:auto; }
  .frame-wrap iframe{ height:100%; }
}
</style>

        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join('')
    );
  }

  function systemPrefersDark(){ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
  function isDarkActive(){
    var attr = document.documentElement.getAttribute('data-theme');
    if(attr === 'dark') return true;
    if(attr === 'light') return false;
    return systemPrefersDark();
  }
  function loadPref(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function savePref(key, v){ try{ localStorage.setItem(key, v); }catch(e){} }

  // Resolve the single theme this whole page will use, then push it into
  // both apps' own storage keys *before* they load, so each app boots up
  // already matching, no flash, no separate toggle needed.
  var desiredTheme = loadPref(SHELL_THEME_KEY); // "light" | "dark" | null (=> follow system)
  var effectiveTheme = desiredTheme || (systemPrefersDark() ? 'dark' : 'light');
  savePref(SIK_THEME_KEY, effectiveTheme);
  savePref(LAB_THEME_KEY, effectiveTheme);

  var frames = {}; // key -> {frame, loading, ready}

  function loadFrame(key, b64ElId, frameId, loadingId){
    var b64 = document.getElementById(b64ElId).textContent.trim();
    var html = b64DecodeUnicode(b64);
    var frame = document.getElementById(frameId);
    var loading = document.getElementById(loadingId);
    frames[key] = { frame: frame, loading: loading, ready: false };
    frame.addEventListener('load', function(){
      if(loading) loading.style.display = 'none';
      frames[key].ready = true;
      hideInnerThemeButton(frame);
    }, { once:true });
    // Assigning as a DOM property (not an HTML attribute) sidesteps any
    // escaping issues, and about:srcdoc inherits the parent's origin, so
    // each app's own localStorage (roster data, theme) keeps working.
    frame.srcdoc = html;
  }

  function hideInnerThemeButton(frame){
    try{
      var btn = frame.contentDocument && frame.contentDocument.getElementById('themeToggle');
      if(btn) btn.style.display = 'none';
    }catch(e){ /* cross-origin fallback: leave the inner button visible */ }
  }

  loadFrame('lab', 'doc-lab-b64', 'frame-lab', 'loading-lab');
  loadFrame('sik', 'doc-sik-b64', 'frame-sik', 'loading-sik');

  /* ---------- tab switching ---------- */
  var tabs = document.querySelectorAll('.tabs button');
  var panes = document.querySelectorAll('.frame-wrap');
  var pill = document.getElementById('tabPill');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function movePill(instant){
    var act = document.querySelector('.tabs button.active');
    if(!act || !pill) return;
    if(instant) pill.classList.add('no-anim');
    pill.style.width = act.offsetWidth + 'px';
    pill.style.transform = 'translateX(' + act.offsetLeft + 'px)';
    if(instant){ void pill.offsetWidth; pill.classList.remove('no-anim'); }
  }
  var tabOrder = Array.prototype.map.call(tabs, function(b){ return b.getAttribute('data-target'); });
  var switching = null;
  function finishSwitch(){
    if(!switching) return;
    switching.leaveEl.classList.remove('leaving');
    switching = null;
  }
  tabs.forEach(function(btn){
    btn.addEventListener('click', function(){
      var targetId = btn.getAttribute('data-target');
      var next = document.getElementById(targetId);
      var cur = document.querySelector('.frame-wrap.active');
      if(cur === next) return;
      finishSwitch();
      tabs.forEach(function(b){ b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
      btn.classList.add('active'); btn.setAttribute('aria-selected','true');
      movePill(false);
      var dir = tabOrder.indexOf(targetId) > tabOrder.indexOf(cur.id) ? 1 : -1;
      cur.classList.remove('active');
      next.classList.add('active');
      if(reduceMotion || !next.animate){ return; }
      cur.classList.add('leaving');
      var out = cur.animate(
        [{ opacity:1, transform:'translateX(0) scale(1)' },
         { opacity:0, transform:'translateX(' + (-dir*56) + 'px) scale(.97)' }],
        { duration:340, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });
      var inn = next.animate(
        [{ opacity:0, transform:'translateX(' + (dir*56) + 'px) scale(.97)' },
         { opacity:1, transform:'translateX(0) scale(1)' }],
        { duration:520, easing:'cubic-bezier(.22,1,.36,1)' });
      switching = { leaveEl:cur, anim:out };
      out.onfinish = function(){ out.cancel(); if(switching && switching.leaveEl === cur) finishSwitch(); };
      setTimeout(function(){ if(switching && switching.leaveEl === cur){ try{ out.cancel(); inn.cancel(); }catch(e){} finishSwitch(); } }, 1600);
    });
  });
  window.addEventListener('resize', function(){ movePill(true); });
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ movePill(true); }); }
  movePill(true);
  window.addEventListener('load', function(){ movePill(true); });

  /* ---------- single, synced theme toggle for the whole page ---------- */
  var themeBtn = document.getElementById('shellTheme');

  function applyTheme(t){
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = isDarkActive() ? '☀️' : '🌙';
  }

  function pushThemeToFrame(key, storageKey, theme){
    var entry = frames[key];
    if(!entry || !entry.ready) return; // not loaded yet: its own boot-time read of storageKey already covers it
    try{
      var doc = entry.frame.contentDocument;
      doc.documentElement.setAttribute('data-theme', theme);
      var win = entry.frame.contentWindow;
      win.localStorage.setItem(storageKey, theme);
    }catch(e){ /* cross-origin fallback: nothing more we can do */ }
  }

  themeBtn.addEventListener('click', function(){
    var next = isDarkActive() ? 'light' : 'dark';
    applyTheme(next);
    savePref(SHELL_THEME_KEY, next);
    savePref(SIK_THEME_KEY, next);
    savePref(LAB_THEME_KEY, next);
    pushThemeToFrame('sik', SIK_THEME_KEY, next);
    pushThemeToFrame('lab', LAB_THEME_KEY, next);
  });

  applyTheme(desiredTheme);


  /* ---------- maskot Skadi: hanya dimuat di layar HP ---------- */
  (function(){
    var MASCOT_KEY = 'skadi-mascot-hidden';
    var box = document.getElementById('skadiMascot');
    var started = false;
    if(!box || !window.matchMedia) return;
    var mq = window.matchMedia('(max-width:640px)');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function start(){
      if(started || !mq.matches || reduce) return;
      if(loadPref(MASCOT_KEY) === '1') return;
      started = true;
      box.innerHTML =
        '<button type="button" class="mascot-x" aria-label="Sembunyikan maskot">&#10005;</button>' +
        '<div class="tenor-gif-embed" data-postid="26382975" data-share-method="host" data-aspect-ratio="1.04235" data-width="100%">' +
        '<a href="https://tenor.com/view/skadi-arknights-skill2-skadi-corrupting-heart-skalter-gif-26382975">Skadi Arknights GIF</a></div>';
      box.querySelector('.mascot-x').addEventListener('click', function(){
        box.classList.remove('show');
        savePref(MASCOT_KEY, '1');
        setTimeout(function(){ box.innerHTML = ''; box.style.display = 'none'; }, 500);
      });
      var sc = document.createElement('script');
      sc.async = true; sc.src = 'https://tenor.com/embed.js';
      document.body.appendChild(sc);
      setTimeout(function(){ box.classList.add('show'); }, 400);
    }
    start();
    if(mq.addEventListener) mq.addEventListener('change', start);
  })();
})();
</script>
